name: Admin Affiliate Registration

on:
  pull_request:
    paths:
      - "src/chatbot-admin/**"
      - "src/main.ts"
      - "src/ia/produto-ia-python.service.ts"
      - "src/ia/produto-ia-python.service.spec.ts"
      - "src/produto-ia-integracao-interna/**"
      - "src/ia/dtos/**"
      - "src/produto-ia-integracao-interna/**"
      - "prisma/migrations/**"
      - "src/ia/dtos/**"
      - "prisma/migrations/**"
      - ".github/workflows/admin-affiliate-registration.yml"
  push:
    branches: [main]
    paths:
      - "src/chatbot-admin/**"
      - "src/main.ts"
      - "src/ia/produto-ia-python.service.ts"
      - "src/ia/produto-ia-python.service.spec.ts"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Gerar cliente Prisma
        run: npx prisma generate
      - name: Testar contrato do chatbot e proxy da IA
        run: npm test -- --runInBand chatbot-admin/dtos/analisar-cadastro-chatbot.dto.spec.ts chatbot-admin/dtos/confirmar-cadastro-chatbot.dto.spec.ts chatbot-admin/chatbot-admin.gpu-clock.spec.ts chatbot-admin/chatbot-admin.hardware-import.spec.ts chatbot-admin/chatbot-admin.ram-category.spec.ts chatbot-admin/chatbot-admin.shopee-partner.spec.ts chatbot-admin/marketplace-domains.spec.ts ia/produto-ia-python.service.spec.ts ia/dtos/categoria-importacao-ia.spec.ts produto-ia-integracao-interna/produto-ia-integracao-interna.service.spec.ts produto-ia-integracao-interna/produto-ia-integracao-interna.controller.spec.ts produto-ia-integracao-interna/prebusca-processador-modelo.spec.ts
      - name: Compilar backend
        run: npm run build
