name: CORS Production Probe

on:
  pull_request:
    paths:
      - "src/main.ts"
      - ".github/workflows/cors-production-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe custom domain preflight
        shell: bash
        run: |
          set +e
          curl -sS -D - -o /tmp/custom-body -X OPTIONS             "https://api.criabyte.com.br/api/admin/chatbot/analisar-cadastro"             -H "Origin: https://criabyte.com.br"             -H "Access-Control-Request-Method: POST"             -H "Access-Control-Request-Headers: content-type"             --max-time 20
          echo "--- BODY custom ---"
          cat /tmp/custom-body 2>/dev/null || true

      - name: Probe Railway domain preflight
        shell: bash
        run: |
          set +e
          curl -sS -D - -o /tmp/railway-body -X OPTIONS             "https://backendpc3d-production.up.railway.app/api/admin/chatbot/analisar-cadastro"             -H "Origin: https://criabyte.com.br"             -H "Access-Control-Request-Method: POST"             -H "Access-Control-Request-Headers: content-type"             --max-time 20
          echo "--- BODY railway ---"
          cat /tmp/railway-body 2>/dev/null || true
