name: Commit schema URLs longas uma vez

on:
  push:
    branches:
      - fix/urls-longas-qualquer-parceiro-20260930
    paths:
      - .github/workflows/commit-schema-urls-once.yml

permissions:
  contents: write

jobs:
  commit-prisma-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/urls-longas-qualquer-parceiro-20260930
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar alteração definitiva do schema
        run: |
          node scripts/aplicar-schema-urls-longas.mjs
          git diff --check -- prisma/schema.prisma
          git diff --stat -- prisma/schema.prisma
      - name: Commit apenas do schema corrigido
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add prisma/schema.prisma
          git commit -m 'fix(db): registrar URL TEXT para ofertas de todas as lojas'
          git push origin HEAD:fix/urls-longas-qualquer-parceiro-20260930
