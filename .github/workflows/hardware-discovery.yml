name: Descoberta ampliada de hardware

on:
  pull_request:
    paths:
      - 'src/hardwares-descoberta-ia/**'
      - 'src/ia/produto-ia-python.service*'
      - 'src/ia/produto-ia-http*'
      - '.github/workflows/hardware-discovery.yml'

permissions:
  contents: read

jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm test -- --runInBand hardwares-descoberta-ia.service.spec.ts produto-ia-python.service.spec.ts produto-ia-http.spec.ts
      - run: npm run build
